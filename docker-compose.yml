services:
  postgres:
    image: postgres:17-alpine
    container_name: hireflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-hireflow_identity}
    ports:
      # Use PORT 5433 by default on host so it does NOT conflict with any locally installed PostgreSQL running on port 5432!
      # If you don't have local Postgres running, you can map 5432:5432 via .env (POSTGRES_PORT=5432).
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - hireflow-postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hireflow_admin} -d ${POSTGRES_DB:-hireflow_identity}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: hireflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  hireflow-postgres-data:
